<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MT EXAM - ระบบรวบรวมข้อสอบเทคนิคการแพทย์</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      footer p:last-child { display: none !important; }
    </style>
    <script>
      (function() {
        const originalFetch = window.fetch;
        window.fetch = async function(...args) {
          const url = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].url ? args[0].url : '');
          const isAuthAction = url.includes('/api/auth/login') || url.includes('/api/auth/register');
          if (isAuthAction) {
            window.__mt_login_in_progress = Date.now();
          }
          const response = await originalFetch.apply(this, args);
          try {
            if (isAuthAction) {
              const clone = response.clone();
              clone.json().then(data => {
                if (data && data.user && data.user.username) {
                  localStorage.setItem('mt_exam_active_username', data.user.username);
                  if (data.sessionId) {
                    localStorage.setItem('mt_exam_sessionId', data.sessionId);
                    localStorage.setItem('mt_exam_active_session_id', data.sessionId);
                  }
                }
                setTimeout(() => {
                  window.__mt_login_in_progress = 0;
                }, 1500);
              }).catch(() => {
                window.__mt_login_in_progress = 0;
              });
            } else if (url.includes('/api/auth/logout')) {
              localStorage.removeItem('mt_exam_active_username');
              localStorage.removeItem('mt_exam_active_session_id');
              localStorage.removeItem('mt_exam_sessionId');
            } else if (url.includes('/api/auth/ping')) {
              if (response.status === 401) {
                const clone = response.clone();
                clone.json().then(data => {
                  if (data && data.forceLogout) {
                    triggerForceLogoutUI(data.error || 'บัญชีนี้มีการเข้าสู่ระบบจากอุปกรณ์อื่น');
                  }
                }).catch(() => {});
              }
            }
          } catch (e) {}
          return response;
        };

        function setupEventStream() {
          const eventSource = new EventSource('/api/events');
          eventSource.addEventListener('force_logout', (event) => {
            try {
              const data = JSON.parse(event.data);
              if (!data) return;
              if (window.__mt_login_in_progress && (Date.now() - window.__mt_login_in_progress < 15000)) {
                return;
              }
              const currentSession = localStorage.getItem('mt_exam_sessionId') || localStorage.getItem('mt_exam_active_session_id');
              const currentUser = localStorage.getItem('mt_exam_active_username');
              if (!currentSession || !currentUser) return;
              if (data.newSessionId && currentSession === data.newSessionId) return;
              const isSameUser = currentUser && data.targetUser && currentUser.toLowerCase() === data.targetUser.toLowerCase();
              const isExactOldSession = data.oldSessionId && currentSession === data.oldSessionId;
              if (isSameUser && isExactOldSession) {
                triggerForceLogoutUI(data.reason || 'บัญชีของคุณได้รับการเข้าสู่ระบบจากอุปกรณ์หรือเบราว์เซอร์อื่น');
              }
            } catch (err) {}
          });
          eventSource.onerror = function() {
            setTimeout(setupEventStream, 5000);
          };
        }
        setupEventStream();

        function triggerForceLogoutUI(message) {
          if (window.__mt_forced_logout_shown) return;
          window.__mt_forced_logout_shown = true;
          localStorage.removeItem('mt_exam_sessionId');
          localStorage.removeItem('mt_exam_active_session_id');
          localStorage.removeItem('mt_exam_active_username');

          const modal = document.createElement('div');
          modal.id = 'mt-force-logout-overlay';
          modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);z-index:9999999;display:flex;align-items:center;justify-content:center;padding:16px;font-family:"Prompt",sans-serif;';
          modal.innerHTML = `
            <div style="background:#1c1917;border:1px solid rgba(245,158,11,0.4);border-radius:24px;padding:28px 24px;max-width:440px;width:100%;text-align:center;box-shadow:0 25px 50px -12px rgba(0,0,0,0.8);color:#f5f5f4;">
              <div style="width:64px;height:64px;margin:0 auto 16px;border-radius:50%;background:rgba(245,158,11,0.15);border:1px solid rgba(245,158,11,0.3);display:flex;align-items:center;justify-content:center;">
                <svg style="width:32px;height:32px;color:#fbbf24;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
              </div>
              <h3 style="font-size:1.25rem;font-weight:700;color:#fbbf24;margin-bottom:8px;">แจ้งเตือนการเข้าสู่ระบบซ้ำ</h3>
              <p style="font-size:0.875rem;color:#d6d3d1;line-height:1.6;margin-bottom:24px;">${message}</p>
              <button id="mt-force-logout-btn" style="width:100%;background:#e11d48;color:#ffffff;font-weight:700;font-size:0.875rem;padding:12px 20px;border-radius:12px;border:none;cursor:pointer;">รับทราบและออกจากระบบ</button>
            </div>
          `;
          document.body.appendChild(modal);
          document.getElementById('mt-force-logout-btn').onclick = () => window.location.reload();
          setTimeout(() => window.location.reload(), 8000);
        }
      })();
    </script>
    <script>
      window.openFAQModal = async function() {
        let existing = document.getElementById('mt-faq-modal');
        if (existing) existing.remove();

        let faqs = [];
        try {
          const res = await fetch('/api/faqs');
          faqs = await res.json();
        } catch (e) {
          faqs = [];
        }

        const modal = document.createElement('div');
        modal.id = 'mt-faq-modal';
        modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);z-index:999999;display:flex;align-items:center;justify-content:center;padding:16px;font-family:"Prompt",sans-serif;';
        
        let faqListHtml = faqs.map((f, idx) => `
          <div style="background:#292524;border:1px solid #44403c;border-radius:16px;padding:16px;margin-bottom:12px;text-align:left;">
            <div style="font-weight:600;color:#fbbf24;font-size:0.95rem;margin-bottom:6px;display:flex;align-items:center;gap:8px;">
              <span style="background:rgba(251,191,36,0.15);color:#fbbf24;padding:2px 8px;border-radius:6px;font-size:0.75rem;">Q${idx+1}</span>
              ${f.question}
            </div>
            <div style="color:#d6d3d1;font-size:0.875rem;line-height:1.6;padding-left:26px;">
              ${f.answer}
            </div>
          </div>
        `).join('');

        if (faqs.length === 0) {
          faqListHtml = '<div style="text-align:center;color:#a8a29e;padding:24px;">ยังไม่มีคำถามที่พบบ่อยในขณะนี้</div>';
        }

        modal.innerHTML = `
          <div style="background:#1c1917;border:1px solid #44403c;border-radius:24px;padding:24px;max-width:600px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 25px 50px -12px rgba(0,0,0,0.8);color:#f5f5f4;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;border-bottom:1px solid #292524;padding-bottom:12px;">
              <div style="display:flex;align-items:center;gap:10px;">
                <div style="width:36px;height:36px;border-radius:10px;background:rgba(251,191,36,0.15);display:flex;align-items:center;justify-content:center;color:#fbbf24;">
                  <svg style="width:20px;height:20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <h2 style="font-size:1.25rem;font-weight:700;color:#f5f5f4;margin:0;">คำถามที่พบบ่อย (FAQ)</h2>
              </div>
              <button id="mt-faq-close-btn" style="background:#292524;border:none;color:#a8a29e;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;">✕</button>
            </div>
            <div style="margin-bottom:20px;">
              ${faqListHtml}
            </div>
            <button id="mt-faq-close-btn-2" style="width:100%;background:#44403c;color:#f5f5f4;font-weight:600;padding:12px;border-radius:12px;border:none;cursor:pointer;">ปิดหน้าต่าง</button>
          </div>
        `;
        document.body.appendChild(modal);

        document.getElementById('mt-faq-close-btn').onclick = () => modal.remove();
        document.getElementById('mt-faq-close-btn-2').onclick = () => modal.remove();
        modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
      };

      // Global functions for Admin FAQ list rendering and deletion (no closure bugs / iframe safe)
      window.showFaqNotification = function(message, type = 'success') {
        const oldNotif = document.getElementById('faq-toast-notif');
        if (oldNotif) oldNotif.remove();

        const toast = document.createElement('div');
        toast.id = 'faq-toast-notif';
        toast.style.cssText = `
          position: fixed;
          top: 24px;
          left: 50%;
          transform: translateX(-50%);
          background: ${type === 'success' ? '#10b981' : '#ef4444'};
          color: white;
          padding: 12px 24px;
          border-radius: 12px;
          box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
          z-index: 99999999;
          font-weight: 600;
          font-size: 0.9rem;
          transition: all 0.3s ease;
          pointer-events: none;
          text-align: center;
          font-family: 'Prompt', sans-serif;
        `;
        toast.textContent = message;
        document.body.appendChild(toast);

        setTimeout(() => {
          toast.style.opacity = '0';
          setTimeout(() => { toast.remove(); }, 300);
        }, 3000);
      };

      window.renderAdminFAQList = function(faqs) {
        const container = document.getElementById('admin-faq-list-container');
        if (!container) return;
        if (!faqs || faqs.length === 0) {
          container.innerHTML = '<div style="text-align:center;color:#a8a29e;padding:24px;">ยังไม่มีคำถามที่พบบ่อยในขณะนี้</div>';
        } else {
          container.innerHTML = faqs.map(f => `
            <div style="background:#292524;border:1px solid #44403c;border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;text-align:left;">
              <div style="flex:1;">
                <div style="font-weight:600;color:#fbbf24;font-size:0.9rem;margin-bottom:4px;">${f.question}</div>
                <div style="color:#d6d3d1;font-size:0.85rem;line-height:1.5;margin-bottom:6px;">${f.answer}</div>
                <div style="font-size:0.7rem;color:#78716c;">เพิ่มโดย: ${f.createdBy || 'Admin'}</div>
              </div>
              <div id="faq-action-${f.id}" style="display:flex;align-items:center;gap:6px;">
                <button onclick="window.askDeleteFAQ('${f.id}')" style="background:rgba(225,29,72,0.15);border:1px solid rgba(225,29,72,0.4);color:#f43f5e;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:0.75rem;font-weight:600;white-space:nowrap;">🗑️ ลบ</button>
              </div>
            </div>
          `).join('');
        }
      };

      window.askDeleteFAQ = function(id) {
        const actionContainer = document.getElementById(`faq-action-${id}`);
        if (!actionContainer) return;
        actionContainer.innerHTML = `
          <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;background:#1c1917;padding:6px;border-radius:8px;border:1px solid #dc2626;">
            <span style="font-size:0.75rem;color:#f43f5e;font-weight:600;white-space:nowrap;">ยืนยันการลบ?</span>
            <div style="display:flex;gap:6px;">
              <button onclick="window.confirmDeleteFAQ('${id}')" style="background:#ef4444;color:white;border:none;padding:4px 8px;border-radius:6px;cursor:pointer;font-size:0.7rem;font-weight:600;">ใช่, ลบเลย</button>
              <button onclick="window.cancelDeleteFAQ('${id}')" style="background:#44403c;color:#f5f5f4;border:none;padding:4px 8px;border-radius:6px;cursor:pointer;font-size:0.7rem;font-weight:600;">ไม่</button>
            </div>
          </div>
        `;
      };

      window.cancelDeleteFAQ = function(id) {
        const actionContainer = document.getElementById(`faq-action-${id}`);
        if (!actionContainer) return;
        actionContainer.innerHTML = `
          <button onclick="window.askDeleteFAQ('${id}')" style="background:rgba(225,29,72,0.15);border:1px solid rgba(225,29,72,0.4);color:#f43f5e;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:0.75rem;font-weight:600;white-space:nowrap;">🗑️ ลบ</button>
        `;
      };

      window.confirmDeleteFAQ = async function(id) {
        const adminUser = localStorage.getItem('mt_exam_active_username') || 'Admin';
        const actionContainer = document.getElementById(`faq-action-${id}`);
        if (actionContainer) {
          actionContainer.innerHTML = '<span style="font-size:0.7rem;color:#a8a29e;">กำลังลบ...</span>';
        }
        try {
          const res = await fetch('/api/faqs/' + encodeURIComponent(id) + '?adminUser=' + encodeURIComponent(adminUser), { method: 'DELETE' });
          const data = await res.json();
          if (data && data.success) {
            window.showFaqNotification('ลบคำถามเรียบร้อยแล้ว');
            window.renderAdminFAQList(data.faqs);
          } else {
            window.showFaqNotification('ไม่สามารถลบข้อมูลได้: ' + (data?.error || 'Unknown error'), 'error');
            window.cancelDeleteFAQ(id);
          }
        } catch (e) {
          window.showFaqNotification('เกิดข้อผิดพลาดในการเชื่อมต่อเพื่อลบข้อมูล', 'error');
          window.cancelDeleteFAQ(id);
        }
      };

      // Inline React Component for Admin FAQ management
      window.AdminFAQTab = function() {
        const [faqs, setFaqs] = window.React.useState([]);
        const [qInput, setQInput] = window.React.useState("");
        const [aInput, setAInput] = window.React.useState("");
        const [deletingId, setDeletingId] = window.React.useState(null);
        const [loading, setLoading] = window.React.useState(false);
        const [saving, setSaving] = window.React.useState(false);

        const fetchFaqs = async () => {
          setLoading(true);
          try {
            const res = await fetch("/api/faqs");
            const data = await res.json();
            setFaqs(data || []);
          } catch (e) {
            console.error(e);
          } finally {
            setLoading(false);
          }
        };

        window.React.useEffect(() => {
          fetchFaqs();
        }, []);

        const handleSave = async () => {
          if (!qInput.trim() || !aInput.trim()) {
            window.showFaqNotification("กรุณากรอกคำถามและคำตอบให้ครบถ้วน", "error");
            return;
          }
          setSaving(true);
          const adminUser = localStorage.getItem("mt_exam_active_username") || "Admin";
          try {
            const res = await fetch("/api/faqs", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ question: qInput.trim(), answer: aInput.trim(), adminUser })
            });
            const data = await res.json();
            if (data.success) {
              window.showFaqNotification("เพิ่มคำถามเรียบร้อยแล้ว");
              setQInput("");
              setAInput("");
              setFaqs(data.faqs || []);
            }
          } catch (e) {
            window.showFaqNotification("เกิดข้อผิดพลาดในการบันทึกข้อมูล", "error");
          } finally {
            setSaving(false);
          }
        };

        const handleDelete = async (id) => {
          const adminUser = localStorage.getItem("mt_exam_active_username") || "Admin";
          try {
            const res = await fetch("/api/faqs/" + encodeURIComponent(id) + "?adminUser=" + encodeURIComponent(adminUser), { method: "DELETE" });
            const data = await res.json();
            if (data && data.success) {
              window.showFaqNotification("ลบคำถามเรียบร้อยแล้ว");
              setFaqs(data.faqs || []);
            } else {
              window.showFaqNotification("ไม่สามารถลบข้อมูลได้", "error");
            }
          } catch (e) {
            window.showFaqNotification("เกิดข้อผิดพลาดในการลบข้อมูล", "error");
          } finally {
            setDeletingId(null);
          }
        };

        return window.React.createElement("div", { className: "space-y-6 w-full flex flex-col min-w-0" },
          window.React.createElement("div", { className: "bg-stone-900 border border-stone-800 rounded-2xl p-6 shadow-xl space-y-6 w-full min-w-0" },
            window.React.createElement("div", { className: "flex items-center gap-3 border-b border-stone-800 pb-4" },
              window.React.createElement("div", { className: "w-10 h-10 bg-amber-500/10 rounded-xl flex items-center justify-center border border-amber-500/20 text-amber-400 font-bold text-lg" }, "❓"),
              window.React.createElement("div", { className: "text-left" },
                window.React.createElement("h3", { className: "text-base font-bold text-white" }, "จัดการคำถามที่พบบ่อย (FAQ)"),
                window.React.createElement("p", { className: "text-stone-400 text-xs mt-0.5" }, "เพิ่ม ลบ หรือปรับปรุงรายการคำถามสำหรับผู้ใช้งานทั่วไป")
              )
            ),
            
            // Input form card
            window.React.createElement("div", { className: "bg-stone-950 border border-stone-800 rounded-xl p-5 space-y-4 text-left" },
              window.React.createElement("h4", { className: "text-xs font-bold text-amber-400 flex items-center gap-1.5" }, "➕ เพิ่มคำถามใหม่"),
              window.React.createElement("div", { className: "space-y-1.5" },
                window.React.createElement("label", { className: "text-xs font-semibold text-stone-300" }, "หัวข้อคำถาม:"),
                window.React.createElement("input", {
                  type: "text",
                  value: qInput,
                  onChange: (e) => setQInput(e.target.value),
                  placeholder: "เช่น วิธีการใช้งานระบบสอบ...",
                  className: "w-full p-2.5 bg-stone-900 border border-stone-800 rounded-xl text-xs text-stone-100 placeholder-stone-600 focus:outline-none focus:border-amber-500/50"
                })
              ),
              window.React.createElement("div", { className: "space-y-1.5" },
                window.React.createElement("label", { className: "text-xs font-semibold text-stone-300" }, "คำตอบ / รายละเอียด:"),
                window.React.createElement("textarea", {
                  value: aInput,
                  onChange: (e) => setAInput(e.target.value),
                  placeholder: "ระบุรายละเอียดคำตอบ...",
                  rows: 3,
                  className: "w-full p-2.5 bg-stone-900 border border-stone-800 rounded-xl text-xs text-stone-100 placeholder-stone-600 focus:outline-none focus:border-amber-500/50 resize-y"
                })
              ),
              window.React.createElement("div", { className: "flex gap-2 pt-1" },
                window.React.createElement("button", {
                  onClick: handleSave,
                  disabled: saving,
                  className: "px-4 py-2 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-bold rounded-xl text-xs cursor-pointer transition-colors"
                }, saving ? "กำลังบันทึก..." : "💾 บันทึกคำถาม"),
                window.React.createElement("button", {
                  onClick: () => { setQInput(""); setAInput(""); },
                  className: "px-3 py-2 bg-stone-800 hover:bg-stone-700 text-stone-300 rounded-xl text-xs cursor-pointer transition-colors"
                }, "ล้างค่า")
              )
            ),

            // List card
            window.React.createElement("div", { className: "space-y-4 text-left" },
              window.React.createElement("h4", { className: "text-xs font-bold text-stone-300" }, "📋 รายการคำถามทั้งหมดที่มีในระบบ"),
              loading ? window.React.createElement("div", { className: "text-center text-xs text-stone-500 py-6" }, "กำลังโหลดข้อมูล...") :
              faqs.length === 0 ? window.React.createElement("div", { className: "text-center text-xs text-stone-500 py-6 border border-dashed border-stone-800 rounded-xl" }, "ยังไม่มีคำถามที่พบบ่อยในขณะนี้") :
              window.React.createElement("div", { className: "space-y-3" },
                faqs.map((f, f_idx) =>
                  window.React.createElement("div", { key: f.id || ("faq_" + f_idx), className: "bg-stone-950 border border-stone-800/60 rounded-xl p-4 flex justify-between items-start gap-4" },
                    window.React.createElement("div", { className: "flex-1" },
                      window.React.createElement("div", { className: "text-xs font-bold text-amber-400 mb-1" }, f.question),
                      window.React.createElement("div", { className: "text-xs text-stone-300 leading-relaxed" }, f.answer),
                      window.React.createElement("div", { className: "text-[10px] text-stone-600 mt-2" }, "เพิ่มโดย: " + (f.createdBy || "Admin"))
                    ),
                    window.React.createElement("div", { className: "shrink-0" },
                      deletingId === f.id ?
                        window.React.createElement("div", { className: "flex flex-col gap-1.5 items-end bg-stone-900 border border-rose-500/40 p-2 rounded-lg" },
                          window.React.createElement("span", { className: "text-[10px] text-rose-400 font-bold" }, "ยืนยันลบ?"),
                          window.React.createElement("div", { className: "flex gap-1.5" },
                            window.React.createElement("button", {
                              onClick: () => handleDelete(f.id),
                              className: "px-2 py-1 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded text-[10px] cursor-pointer"
                            }, "ใช่"),
                            window.React.createElement("button", {
